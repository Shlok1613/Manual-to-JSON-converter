<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Extraction</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
.glass {
  background: rgba(15,23,42,0.6);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.08);
}
</style>

</head>

<body class="min-h-screen text-white font-sans selection:bg-cyan-500/30 overflow-x-hidden"
style="background: #020617; background-image: radial-gradient(circle at top right, rgba(30, 58, 138, 0.4), transparent 40%), radial-gradient(circle at bottom left, rgba(15, 23, 42, 0.8), transparent 40%);">

<!-- TOAST CONTAINER -->
<div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3"></div>

<!-- CONFIRMATION MODAL -->
<div id="delete-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center bg-black/60 backdrop-blur-sm transition-opacity opacity-0">
  <div class="glass p-8 rounded-2xl max-w-sm w-full shadow-2xl transform scale-95 transition-transform opacity-0 translate-y-4 duration-300" id="delete-modal-content">
    <div class="flex items-center gap-4 mb-4 text-red-400">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
      <h3 class="text-xl font-bold">Confirm Deletion</h3>
    </div>
    <p class="text-slate-300 mb-6" id="delete-modal-message">Are you sure you want to delete this?</p>
    
    <div class="flex gap-3 justify-end">
      <button onclick="closeModal()" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 transition text-sm font-medium">Cancel</button>
      <button id="confirm-delete-btn" class="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-500 transition text-sm font-medium text-white flex items-center justify-center gap-2 min-w-[100px]">Delete</button>
    </div>
  </div>
</div>

<div class="max-w-7xl mx-auto px-6 md:px-12 py-8">

<!-- TOP -->
<div class="flex justify-between items-center mb-8">
  <button onclick="window.location.href='/'"
    class="flex items-center gap-2 px-4 py-2 bg-slate-800/80 border border-slate-700 rounded-lg hover:bg-slate-700 hover:border-slate-600 transition-colors shadow-sm">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
    </svg>
    <span>Back to Dashboard</span>
  </button>

  <div id="header-status" class="px-4 py-1.5 bg-slate-800/50 border border-slate-700 text-slate-400 rounded-full text-sm font-medium flex items-center gap-2 shadow-sm">
    <div class="w-4 h-4 rounded-full border-2 border-slate-500 border-t-transparent animate-spin"></div>
    Loading Status...
  </div>
</div>

<h1 class="text-3xl md:text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-400 mb-2 truncate" id="title" title="Loading...">
  <div class="h-10 w-64 bg-slate-800 rounded animate-pulse"></div>
</h1>
<p class="text-slate-400 font-mono text-sm mb-10" id="id-display"></p>

<!-- MAIN CONTENT WRAPPER -->
<div id="content" class="space-y-8 relative">
  <!-- SKELETON LOADERS -->
  <div class="grid md:grid-cols-2 gap-8" id="skeleton-loader">
    <div class="glass p-6 rounded-2xl border border-slate-700/50">
      <div class="h-7 w-48 bg-slate-800 rounded animate-pulse mb-6"></div>
      <div class="space-y-4">
        <div class="h-4 w-full bg-slate-800 rounded animate-pulse"></div>
        <div class="h-4 w-3/4 bg-slate-800 rounded animate-pulse"></div>
        <div class="h-4 w-5/6 bg-slate-800 rounded animate-pulse"></div>
      </div>
      <div class="h-10 w-32 bg-slate-800 rounded animate-pulse mt-8"></div>
    </div>
    <div class="glass p-6 rounded-2xl border border-slate-700/50">
      <div class="h-7 w-40 bg-slate-800 rounded animate-pulse mb-6"></div>
      <div class="space-y-3">
        <div class="h-16 w-full bg-slate-800 rounded animate-pulse"></div>
        <div class="h-16 w-full bg-slate-800 rounded animate-pulse"></div>
        <div class="h-16 w-full bg-slate-800 rounded animate-pulse"></div>
      </div>
    </div>
  </div>
</div>

</div>

<script>
const API = "http://127.0.0.1:8000";
const urlParams = new URLSearchParams(window.location.search);
const id = urlParams.get("id");

// --- UTILS: TOASTS & MODALS ---
function showToast(message, type = 'success') {
  const container = document.getElementById('toast-container');
  if (!container) return;

  const toast = document.createElement('div');
  const bgClass = type === 'success' ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-100' : 'bg-red-500/20 border-red-500/50 text-red-100';
  const icon = type === 'success' 
    ? `<svg class="w-5 h-5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>`
    : `<svg class="w-5 h-5 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>`;

  toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl border backdrop-blur-md shadow-lg transform transition-all duration-300 translate-x-full opacity-0 ${bgClass}`;
  toast.innerHTML = `${icon} <span class="font-medium text-sm">${message}</span>`;
  container.appendChild(toast);

  requestAnimationFrame(() => toast.classList.remove('translate-x-full', 'opacity-0'));

  setTimeout(() => {
    toast.classList.add('translate-x-full', 'opacity-0');
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

let deleteConfig = { id: null, deletePdf: false };

function confirmDelete(extractionId, deletePdf) {
  deleteConfig = { id: extractionId, deletePdf: deletePdf };
  
  const modal = document.getElementById('delete-modal');
  const modalContent = document.getElementById('delete-modal-content');
  const modalMessage = document.getElementById('delete-modal-message');
  
  if (modalMessage) {
    modalMessage.innerText = deletePdf 
      ? "Are you sure you want to delete this extraction AND the original PDF? This action cannot be undone."
      : "Are you sure you want to delete the extracted results? The original PDF will remain.";
  }

  if (modal && modalContent) {
    modal.classList.remove('hidden');
    setTimeout(() => {
      modal.classList.remove('opacity-0');
      modalContent.classList.remove('opacity-0', 'translate-y-4', 'scale-95');
    }, 10);
  }
}

function closeModal() {
  const modal = document.getElementById('delete-modal');
  const modalContent = document.getElementById('delete-modal-content');
  if (modal && modalContent) {
    modal.classList.add('opacity-0');
    modalContent.classList.add('opacity-0', 'translate-y-4', 'scale-95');
    setTimeout(() => {
      modal.classList.add('hidden');
      deleteConfig = { id: null, deletePdf: false };
    }, 300);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const confirmBtn = document.getElementById('confirm-delete-btn');
  if (confirmBtn) {
    confirmBtn.addEventListener('click', async () => {
      if (deleteConfig.id) {
        await executeDelete(deleteConfig.id, deleteConfig.deletePdf);
        closeModal();
      }
    });
  }
});

async function executeDelete(extractionId, deletePdf) {
  try {
    const res = await fetch(`${API}/api/extraction/${extractionId}?delete_pdf=${deletePdf}`, { method: 'DELETE' });
    if (res.ok) {
      if (deletePdf) {
        // Full delete — go back to dashboard
        showToast('Extraction fully deleted. Redirecting...', 'success');
        setTimeout(() => { window.location.href = '/'; }, 1500);
      } else {
        // Results-only — reload page to reflect new state (no Excels, PDF still accessible)
        showToast('Results deleted. Original PDF is preserved.', 'success');
        setTimeout(() => { window.location.reload(); }, 1200);
      }
    } else {
      const data = await res.json();
      showToast(data.detail || 'Failed to delete extraction', 'error');
    }
  } catch (err) {
    showToast('Network error during deletion', 'error');
  }
}

// --- FILE DOWNLOAD UTILS ---
function downloadExcel(url, filename) {
  showToast(`Downloading ${filename}...`, 'success');
  // Create an invisible anchor to trigger browser download
  const link = document.createElement('a');
  link.href = `${API}${url}`;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// --- MAIN LOAD LOGIC ---
async function loadExtraction() {
  if (!id) {
    document.getElementById("content").innerHTML = `<div class="text-red-400 p-6 glass rounded-2xl">Error: No Extraction ID provided in URL.</div>`;
    document.getElementById("skeleton-loader")?.remove();
    return;
  }

  try {
    const res = await fetch(`${API}/api/extraction/${id}`);

    if (!res.ok) {
      if (res.status === 404) {
        showToast("Extraction not found or deleted", "error");
        setTimeout(() => { window.location.href = "/"; }, 1200);
        return;
      }
      throw new Error('Failed to load extraction data');
    }

    const data = await res.json();
    const excelFiles = data.excel_files || [];
    const machineSummary = data.machine_summary || [];

    document.getElementById("title").innerText = (data.machines && data.machines[0]) || id;
    document.getElementById("id-display").innerText = `ID: ${id}`;

    const isFailed = data.status === 'failed';
    const statusEl = document.getElementById("header-status");
    if (isFailed) {
      statusEl.className = "px-4 py-1.5 bg-red-500/10 border border-red-500/20 text-red-400 rounded-full text-sm font-medium flex items-center gap-2 shadow-sm";
      statusEl.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg> Processing Failed`;
    } else {
      statusEl.className = "px-4 py-1.5 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded-full text-sm font-medium flex items-center gap-2 shadow-sm";
      statusEl.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg> Completed Successfully`;
    }

    let machinesHTML = '';
    if (machineSummary.length > 0) {
      machinesHTML = machineSummary.map(m => {
        const consolidatedFile = excelFiles.find(f => f.includes(`_${m.machine}_All_CatID`));
        const downloadAllBtn = consolidatedFile
          ? `<button onclick="downloadExcel('/api/download/${id}/${consolidatedFile}', '${consolidatedFile}')"
               class="px-3 py-1.5 bg-cyan-500/10 text-cyan-400 hover:bg-cyan-500/20 rounded-lg transition border border-cyan-500/20 text-xs font-medium">
               Download Full
             </button>`
          : '';

        const variants = m.variants || [];
        let variantRows = '';
        variants.forEach(variant => {
          const variantFile = excelFiles.find(f =>
            f.includes(`_${m.machine}_${variant}.xlsx`) ||
            f.endsWith(`_${variant}.xlsx`)
          );
          const dlBtn = variantFile
            ? `<button onclick="downloadExcel('/api/download/${id}/${variantFile}', '${variantFile}')"
                 class="px-2 py-1 bg-purple-500/10 text-purple-400 hover:bg-purple-500/20 rounded-lg transition border border-purple-500/20 text-xs font-medium">
                 Download
               </button>`
            : '';
          variantRows += `
            <div class="flex justify-between items-center px-4 py-2 bg-slate-800/20 border-l-2 border-purple-500/30 ml-8 rounded-r-lg">
              <span class="text-sm text-purple-300 font-medium">${variant}</span>
              ${dlBtn}
            </div>`;
        });

        return `
          <div class="bg-slate-800/40 border border-slate-700/50 rounded-xl overflow-hidden hover:border-cyan-500/30 transition-all">
            <div class="flex justify-between items-center p-4 cursor-pointer" onclick="this.nextElementSibling.classList.toggle('hidden')">
              <div class="flex items-center gap-3">
                <div class="p-2 bg-slate-700 rounded-lg text-slate-300">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18"/>
                  </svg>
                </div>
                <span class="font-medium text-slate-200">${m.machine}</span>
              </div>
              <div class="flex items-center gap-3">
                ${downloadAllBtn}
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
              </div>
            </div>
            ${variantRows ? `<div class="border-t border-slate-700/50 py-2 space-y-1">${variantRows}</div>` : ''}
          </div>`;
      }).join('');
    } else {
      machinesHTML = `<div class="p-6 text-center text-slate-500 bg-slate-800/20 rounded-xl border border-dashed border-slate-700">No machine data available.</div>`;
    }

    document.getElementById("content").innerHTML = `
    <div class="grid lg:grid-cols-3 gap-8 items-start">
      <div class="glass p-8 rounded-3xl border border-slate-700/50 shadow-xl overflow-hidden relative">
        <div class="absolute inset-x-0 top-0 h-1 bg-gradient-to-r from-cyan-500 to-blue-600 opacity-50"></div>
        <h2 class="text-xl font-bold mb-6 text-white">Extraction Summary</h2>
        <div class="space-y-4 mb-8">
          <div class="flex justify-between items-center pb-3 border-b border-slate-700/50">
            <span class="text-slate-400">Pages Processed</span>
            <span class="font-semibold text-white bg-slate-800 px-3 py-1 rounded-full">${data.num_pages || "-"}</span>
          </div>
          <div class="flex justify-between items-center pb-3 border-b border-slate-700/50">
            <span class="text-slate-400">Machines Found</span>
            <span class="font-semibold text-white bg-slate-800 px-3 py-1 rounded-full">${data.num_machines || "-"}</span>
          </div>
          <div class="flex justify-between items-center pb-3 border-b border-slate-700/50">
            <span class="text-slate-400">Date</span>
            <span class="text-sm text-slate-300">${data.timestamp ? new Date(data.timestamp).toLocaleDateString() : "-"}</span>
          </div>
        </div>
        <button onclick="confirmDelete('${id}', false)" class="w-full py-3 mb-3 bg-red-500/10 text-red-400 border border-red-500/30 rounded-xl hover:bg-red-500/20 transition font-medium flex justify-center items-center gap-2 text-sm">
          Delete Results Only
        </button>
        <button onclick="confirmDelete('${id}', true)" class="w-full py-3 bg-red-600 hover:bg-red-500 text-white rounded-xl transition font-medium flex justify-center items-center gap-2 text-sm">
          Delete Results & PDF
        </button>
      </div>

      <div class="lg:col-span-2 glass p-8 rounded-3xl border border-slate-700/50 shadow-xl">
        <h2 class="text-xl font-bold mb-6 text-white">Machines (${data.num_machines || 0})</h2>
        <div class="space-y-4 max-h-[500px] overflow-y-auto pr-2 custom-scrollbar">
          ${machinesHTML}
        </div>
      </div>
    </div>`;

  } catch (error) {
    document.getElementById("content").innerHTML = `
      <div class="text-red-400 p-6 glass rounded-2xl border border-red-500/30">
        Error loading extraction data: ${error.message}
      </div>`;
    document.getElementById("title").innerText = "Error";
  }
}

async function showJSON() {
  try {
    const res = await fetch(`${API}/api/extraction/${id}`);
    const data = await res.json();
    // Use a modal in a real app, fallback to alert with better formatting
    alert("Raw JSON Data\n\n" + JSON.stringify(data, null, 2));
  } catch (e) {
    showToast("Failed to fetch JSON", "error");
  }
}

// Start sequence
loadExtraction();
</script>

<style>
  /* Custom Scrollbar for Machines panel */
  .custom-scrollbar::-webkit-scrollbar {
    width: 6px;
  }
  .custom-scrollbar::-webkit-scrollbar-track {
    background: rgba(15, 23, 42, 0.4);
    border-radius: 4px;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb {
    background: rgba(71, 85, 105, 0.8);
    border-radius: 4px;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb:hover {
    background: rgba(148, 163, 184, 0.8);
  }
</style>

</body>
</html>
