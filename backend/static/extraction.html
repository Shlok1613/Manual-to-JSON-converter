<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Extraction Detail</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen text-white p-10"
style="background: linear-gradient(135deg, #0f172a, #020617);">

<h1 class="text-3xl text-cyan-400 mb-6">Extraction Detail</h1>

<div id="content"></div>

<!-- JSON Modal -->
<div id="jsonModal" class="hidden fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center">
  <div class="bg-slate-800 p-6 rounded-2xl max-w-3xl w-full max-h-[80vh] overflow-auto">
    <button onclick="closeJSON()" class="text-red-400 mb-4">Close</button>
    <pre id="jsonContent" class="text-green-400 text-sm"></pre>
  </div>
</div>

<script>
const API = "http://127.0.0.1:8000";
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

async function loadExtraction() {
  const response = await fetch(`${API}/api/files/${id}`);
  const data = await response.json();

  let machineList = data.metadata.machines.map(m => `
    <div class="bg-slate-700 p-4 rounded-xl mb-3 hover:bg-slate-600 transition">
      ${m}
    </div>
  `).join("");

  let files = data.files.map(f => `
    <a href="${API}${f.download_url}"
      class="block bg-green-600 hover:bg-green-500 p-2 rounded mb-2 transition shadow-md">
      Download ${f.filename}
    </a>
  `).join("");

  document.getElementById("content").innerHTML = `
    <div class="bg-slate-800 p-6 rounded-2xl shadow-xl">
      <p><strong>ID:</strong> ${id}</p>
      <p><strong>Machines Found:</strong> ${data.metadata.num_machines}</p>

      <h2 class="text-xl mt-6 mb-3 text-cyan-400">Machines</h2>
      ${machineList}

      <h2 class="text-xl mt-6 mb-3 text-cyan-400">Files</h2>
      ${files}

      <button onclick="showJSON()"
        class="mt-6 bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-xl shadow-lg shadow-purple-500/50">
        View Metadata JSON
      </button>
    </div>
  `;
}

async function showJSON() {
  const response = await fetch(`${API}/api/extraction/${id}`);
  const data = await response.json();

  document.getElementById("jsonContent").innerText =
    JSON.stringify(data, null, 2);

  document.getElementById("jsonModal").classList.remove("hidden");
}

function closeJSON() {
  document.getElementById("jsonModal").classList.add("hidden");
}

loadExtraction();
</script>

</body>
</html>
